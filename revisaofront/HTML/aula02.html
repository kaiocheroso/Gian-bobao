<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>BootsTrap</title>
    <link rel="stylesheet" href="/CSS/style2.css" />
  </head>

  <body>
    <header>
      <h1>Reforço com BootStrap</h1>
      <div
        id="carouselExampleAutoplaying"
        class="carousel slide"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="..\imagem\imagem1.png" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="..\imagem\imagem2.png" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="..\imagem\imagem3.png" class="d-block w-100" alt="..." />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
      <div class="container mt-4">
        <div class="row">
          <div class="col-4">
            <div class="card" style="width: 18rem">
              <img src="..\imagem\coala.png" class="card-img-top" alt="..." />
              <div class="card-body">
                <h5 class="card-title">coala</h5>
                <p class="card-text">coala legal e bem bonito.</p>
                <a href="#" class="btn btn-primary">alugar</a>
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="card" style="width: 18rem">
              <img src="..\imagem\lontra.png" class="card-img-top" alt="..." />
              <div class="card-body">
                <h5 class="card-title">lontra</h5>
                <p class="card-text">bem fofinha e aprende truques.</p>
                <a href="#" class="btn btn-primary">alugar</a>
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="card" style="width: 18rem">
              <img src="..\imagem\macaco.png" class="card-img-top" alt="..." />
              <div class="card-body">
                <h5 class="card-title">macaco</h5>
                <p class="card-text">
                  os macacos sao animais bem legais e esse tambem.
                </p>
                <a href="#" class="btn btn-primary">alugar</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <section></section>
    <nav></nav>
    <footer></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
